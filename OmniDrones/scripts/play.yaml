# hydra.job.chdir: false
hydra:
  searchpath:
  # see https://hydra.cc/docs/advanced/search_path/
   - file://../cfg

headless: true

# --- CHANGE THIS BLOCK ---
livestream:
  enabled: false       # Use this cmd to enable it E.g <python play.py task=Hover headless=true livestream.enabled=true>
  type: webrtc        # <--- OPTIONAL: Be explicit (some versions require this)

# --- ADD THESE LINES ---
# SimulationApp often looks for top-level width/height for the render buffer
width: 1280
height: 720
# ---------------------

sim: ${task.sim}
env: ${task.env}

total_frames: -1
seed: 0

viewer:
  resolution: [960, 720]
  eye: [8, 0., 6.]
  lookat: [0., 0., 1.]

defaults:
  - task: Hover
  - algo: ppo
  - _self_
